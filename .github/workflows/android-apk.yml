name: Build touchHLE Android APK

on:
  push:
    branches: [android-apk-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4

      - name: Install Boost
        run: |
          curl -L --fail -o boost.7z \
            https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          7z x boost.7z -ovendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Install CMake
        run: |
          curl -L --fail -o cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          mkdir -p vendor
          tar -xzf cmake.tar.gz -C vendor
          mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

      - name: Configure Android project
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: touchHLE-Android-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
